name: CI
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: ci_secret_github_only
          POSTGRES_DB: agent_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://agent:ci_secret_github_only@127.0.0.1:5432/agent_dev
      JWT_SECRET: ci-dummy-secret-min-32-karakter-abcdef
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec nx run-many -t typecheck --parallel=2
      - run: pnpm exec nx run-many -t lint --parallel=2
      - run: pnpm --filter @nusantara-erp/api exec drizzle-kit migrate
      - run: pnpm exec nx run-many -t test --parallel=1
      - run: pnpm exec nx run-many -t build --parallel=1
